# Daily maintenance: retention and clean-up through the worker API (SPEC §7.5, §8.3). Daily at 03:00 UTC, or by hand.
# The Actions log is public: only the worker's logger lines go to it.
name: Maintenance

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# The checkout uses APP_REPO_TOKEN, so the job's own GitHub token needs no scopes.
permissions: {}

jobs:
  maintenance:
    if: github.repository == 'josephsilcock/journey-monitor-runner'
    # No browser needed, so no Playwright container.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the app
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: josephsilcock/journey-monitor
          ref: main
          token: ${{ secrets.APP_REPO_TOKEN }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          # setup-node v5 caches the packageManager by default, which needs pnpm before the step below installs it.
          package-manager-cache: false
      # Node 25+ no longer bundles Corepack: install the pnpm version pinned in package.json's packageManager.
      - name: Install pnpm
        run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - name: Install the worker
        run: pnpm install --frozen-lockfile --filter "@journey-monitor/worker..."
      # Started by node directly, so nothing but the worker's logger lines reaches the log.
      - name: Run maintenance
        run: node apps/worker/src/cli.ts maintenance
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
